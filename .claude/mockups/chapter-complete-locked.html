<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapter Complete — Locked (v3)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Antic+Didone&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 56px;
      background: #DEDAD3;
      font-family: 'Inter', sans-serif;
      padding: 48px 24px;
    }

    .phone {
      width: 390px;
      height: 844px;
      background: #F4EFE6;
      border-radius: 52px;
      position: relative;
      overflow: hidden;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.18),
        0 0 0 1.5px #292520,
        0 0 0 3px #343028,
        0 32px 72px rgba(0,0,0,0.42),
        0 12px 28px rgba(0,0,0,0.22);
      flex-shrink: 0;
    }

    .island {
      position: absolute;
      top: 14px; left: 50%;
      transform: translateX(-50%);
      width: 118px; height: 34px;
      background: #0E0C0A;
      border-radius: 17px;
      z-index: 20;
    }

    .home-bar {
      position: absolute;
      bottom: 10px; left: 50%;
      transform: translateX(-50%);
      width: 134px; height: 5px;
      background: rgba(28, 24, 20, 0.18);
      border-radius: 3px;
    }

    .phone-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .label {
      margin-top: 16px;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(28, 24, 20, 0.35);
    }
  </style>
</head>
<body>

  <!-- ══════════════════════════════════════
       V3 — USER DIRECTION
  ═══════════════════════════════════════ -->
  <div class="phone-wrap">
    <div class="phone">
      <div class="island"></div>

      <div style="position: absolute; inset: 0;">

        <!-- Top content: anchored from the top edge -->
        <div style="
          position: absolute;
          top: 68px; left: 32px; right: 32px;
          display: flex; flex-direction: column; align-items: center;
        ">
          <div style="
            font-family: 'Inter', sans-serif; font-weight: 400;
            font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
            color: #C4894A; text-align: center;
          ">Chapter I Complete</div>

          <div style="height: 28px;"></div>

          <div style="
            font-family: 'Antic Didone', serif;
            font-size: 40px; line-height: 1.15;
            color: #1C1814; text-align: center;
          ">The Background.</div>

          <!-- Copper divider -->
          <div style="
            display: flex; align-items: center; gap: 8px;
            width: 140px; margin: 16px 0 14px;
          ">
            <div style="flex: 1; height: 0.5px; background: #C4894A;"></div>
            <div style="width: 5px; height: 5px; background: #C4894A; transform: rotate(45deg); flex-shrink: 0;"></div>
            <div style="flex: 1; height: 0.5px; background: #C4894A;"></div>
          </div>

          <!-- subtitle moved below portrait -->
        </div>

        <!-- Portrait + subtitle below: anchored together, centred in remaining space -->
        <div style="
          position: absolute;
          top: calc(50% + 20px); left: 50%;
          transform: translate(-50%, -50%);
          display: flex; flex-direction: column; align-items: center; gap: 16px;
        ">
          <!-- D: outer glow ring -->
          <div style="position: relative; width: 158px; height: 158px;">
            <!-- faint outer ring -->
            <div style="
              position: absolute;
              inset: -7px;
              border-radius: 50%;
              border: 1px solid rgba(196, 137, 74, 0.2);
            "></div>
            <!-- portrait -->
            <div style="
              width: 158px; height: 158px;
              border-radius: 50%;
              background: linear-gradient(150deg, #B09080 0%, #C8B09A 45%, #8A7060 100%);
              border: 1.5px solid rgba(196, 137, 74, 0.45);
              box-shadow: 0 16px 48px rgba(0,0,0,0.22), 0 6px 16px rgba(0,0,0,0.14);
              display: flex; align-items: center; justify-content: center;
            ">
              <div style="
                font-family: 'Antic Didone', serif;
                font-size: 54px; color: rgba(244,239,230,0.72); line-height: 1;
              ">P</div>
            </div>
          </div>

          <!-- B: subtitle as caption below portrait -->
          <div style="
            font-family: 'Inter', sans-serif; font-weight: 300;
            font-size: 15px; line-height: 1.55;
            color: rgba(28, 24, 20, 0.5); text-align: center;
          ">Paloma's Music opens in 2 days.</div>
        </div>

        <!-- Bottom content: anchored from the bottom edge -->
        <div style="
          position: absolute;
          bottom: 48px; left: 32px; right: 32px;
          display: flex; flex-direction: column; align-items: center; gap: 0;
        ">
          <div style="
            font-family: 'Inter', sans-serif; font-weight: 300;
            font-size: 13px; color: rgba(28, 24, 20, 0.4);
            text-align: center; letter-spacing: 0.1px;
          ">Follow her so you don't miss it.</div>

          <div style="height: 26px;"></div>

          <div style="
            width: 100%; padding: 17px 0;
            background: #1C1814; border-radius: 14px;
            font-family: 'Inter', sans-serif; font-weight: 500; font-size: 16px;
            color: #F4EFE6; text-align: center; letter-spacing: 0.15px;
          ">Follow Paloma</div>

          <div style="height: 18px;"></div>

          <div style="
            font-family: 'Inter', sans-serif; font-weight: 400; font-size: 14px;
            color: rgba(28, 24, 20, 0.45); text-align: center;
          ">Back home</div>
        </div>

      </div>
      <div class="home-bar"></div>
    </div>
    <div class="label">V3 — New direction</div>
  </div>


  <!-- ══════════════════════════════════════
       ORIGINAL — for reference
  ═══════════════════════════════════════ -->
  <div class="phone-wrap">
    <div class="phone">
      <div class="island"></div>

      <div style="
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: center;
        padding: 68px 32px 48px;
        justify-content: space-between;
      ">
        <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0;">
          <div style="
            font-family:'Inter',sans-serif; font-weight:400;
            font-size:12px; letter-spacing:3px; text-transform:uppercase;
            color:#C4894A; text-align:center; margin-bottom:14px;
          ">Chapter I Complete</div>
          <div style="font-family:'Antic Didone',serif; font-size:44px; color:#1C1814; text-align:center;">Complete.</div>
        </div>

        <div style="display:flex; flex-direction:column; align-items:center; gap:22px; padding: 0 0 24px;">
          <div style="
            width:150px; height:150px; border-radius:50%;
            background: linear-gradient(145deg, #9A8878 0%, #C4B09A 50%, #8A7A6A 100%);
            border: 1px solid rgba(196,137,74,0.4);
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            display:flex; align-items:center; justify-content:center;
          ">
            <div style="font-family:'Antic Didone',serif; font-size:42px; color:rgba(244,239,230,0.7);">P</div>
          </div>
          <div style="
            font-family:'Inter',sans-serif; font-weight:300; font-size:15px;
            color:rgba(28,24,20,0.55); text-align:center; line-height:1.55;
          ">Come back in 3 days for Chapter II — Music.
Follow Paloma so you don't miss it.</div>
        </div>

        <div style="width:100%; display:flex; flex-direction:column; align-items:center; gap:18px;">
          <div style="
            width:100%; padding:17px 0; background:#1C1814; border-radius:14px;
            font-family:'Inter',sans-serif; font-weight:500; font-size:16px;
            color:#F4EFE6; text-align:center;
          ">Follow Paloma</div>
          <div style="
            font-family:'Inter',sans-serif; font-weight:400; font-size:14px;
            color:rgba(28,24,20,0.45); text-align:center;
          ">Back home</div>
        </div>
      </div>

      <div class="home-bar"></div>
    </div>
    <div class="label">Original</div>
  </div>

</body>
</html>
