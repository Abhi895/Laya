<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapter Complete — Locked (Dark vs Light)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Antic+Didone&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 48px;
      background: #DEDAD3;
      font-family: 'Inter', sans-serif;
      padding: 48px 32px;
    }

    .phone-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .label {
      font-family: 'Inter', sans-serif;
      font-size: 11px; font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(28, 24, 20, 0.35);
    }

    .phone {
      width: 390px;
      height: 844px;
      border-radius: 52px;
      position: relative;
      overflow: hidden;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.18),
        0 0 0 1.5px #292520,
        0 0 0 3px #343028,
        0 32px 72px rgba(0,0,0,0.42),
        0 12px 28px rgba(0,0,0,0.22);
      flex-shrink: 0;
    }

    .phone.dark { background: #1C1814; }
    .phone.light { background: #F4EFE6; }

    .island {
      position: absolute;
      top: 14px; left: 50%;
      transform: translateX(-50%);
      width: 118px; height: 34px;
      background: #0E0C0A;
      border-radius: 17px;
      z-index: 20;
    }

    .home-bar {
      position: absolute;
      bottom: 10px; left: 50%;
      transform: translateX(-50%);
      width: 134px; height: 5px;
      border-radius: 3px;
      z-index: 20;
    }

    .dark .home-bar { background: rgba(244, 239, 230, 0.18); }
    .light .home-bar { background: rgba(28, 24, 20, 0.18); }

    /* ── Photo zone — bleeds through notch & status bar ── */
    .photo-zone {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 540px;
    }

    .photo-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      filter: grayscale(1) contrast(1.05) brightness(1.02);
    }

    /* Bottom fade into panel */
    .dark .photo-gradient-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 340px;
      background: linear-gradient(to bottom,
        transparent 0%,
        rgba(28,24,20,0.06) 20%,
        rgba(28,24,20,0.35) 45%,
        rgba(28,24,20,0.78) 65%,
        #1C1814 82%,
        #1C1814 100%
      );
    }

    .light .photo-gradient-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 340px;
      background: linear-gradient(to bottom,
        transparent 0%,
        rgba(244,239,230,0.06) 20%,
        rgba(244,239,230,0.38) 45%,
        rgba(244,239,230,0.78) 65%,
        #F4EFE6 82%,
        #F4EFE6 100%
      );
    }

    /* Status pill */
    .status-pill {
      position: absolute;
      top: 20px; left: 24px;
      display: flex; align-items: center; gap: 7px;
      padding: 8px 15px;
      background: rgba(12,10,8,0.48);
      backdrop-filter: blur(18px) saturate(1.3);
      -webkit-backdrop-filter: blur(18px) saturate(1.3);
      border-radius: 22px;
      z-index: 25;
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #C4894A;
      flex-shrink: 0;
    }

    .status-text {
      font-family: 'Inter', sans-serif;
      font-size: 11px; font-weight: 500;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: rgba(244, 239, 230, 0.92);
      white-space: nowrap;
    }

    /* Content panel */
    .panel {
      position: absolute;
      top: 500px; bottom: 0;
      left: 0; right: 0;
      padding: 0 32px 44px;
      display: flex;
      flex-direction: column;
    }

    .eyebrow {
      font-family: 'Inter', sans-serif;
      font-size: 11px; font-weight: 400;
      letter-spacing: 2.8px;
      text-transform: uppercase;
      color: #C4894A;
      margin-bottom: 10px;
    }

    .dark .chapter-title {
      font-family: 'Antic Didone', serif;
      font-size: 64px; line-height: 1.0;
      color: #F4EFE6;
      margin-bottom: 11px;
    }

    .light .chapter-title {
      font-family: 'Antic Didone', serif;
      font-size: 64px; line-height: 1.0;
      color: #1C1814;
      margin-bottom: 11px;
    }

    .dark .chapter-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 15px; font-weight: 300; line-height: 1.55;
      color: rgba(244, 239, 230, 0.46);
    }

    .light .chapter-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 15px; font-weight: 300; line-height: 1.55;
      color: rgba(28, 24, 20, 0.46);
    }

    .flex-spacer { flex: 1; min-height: 12px; max-height: 44px; }

    .progress-row {
      display: flex; align-items: center;
      gap: 8px; margin-bottom: 20px;
    }

    .dot { width: 7px; height: 7px; border-radius: 50%; }

    .dark .dot-done  { background: #F4EFE6; }
    .dark .dot-next  { background: rgba(244,239,230,0.18); }
    .light .dot-done { background: #1C1814; }
    .light .dot-next { background: rgba(28,24,20,0.18); }

    .dark .progress-label {
      font-family: 'Inter', sans-serif;
      font-size: 10px; font-weight: 400;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: rgba(244, 239, 230, 0.28);
      margin-left: 3px;
    }

    .light .progress-label {
      font-family: 'Inter', sans-serif;
      font-size: 10px; font-weight: 400;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: rgba(28, 24, 20, 0.30);
      margin-left: 3px;
    }

    /* Follow CTA */
    .dark .follow-btn {
      width: 100%; padding: 18px 0;
      background: #C4894A;
      border-radius: 50px;
      font-family: 'Inter', sans-serif;
      font-size: 16px; font-weight: 500;
      color: #F4EFE6; text-align: center;
      letter-spacing: 0.2px; margin-bottom: 16px;
    }

    .light .follow-btn {
      width: 100%; padding: 18px 0;
      background: #2A2018;
      border-radius: 50px;
      font-family: 'Inter', sans-serif;
      font-size: 16px; font-weight: 500;
      color: #F4EFE6; text-align: center;
      letter-spacing: 0.2px; margin-bottom: 16px;
    }

    .dark .back-link {
      font-family: 'Inter', sans-serif;
      font-size: 14px; font-weight: 400;
      color: rgba(244, 239, 230, 0.30);
      text-align: center;
    }

    .light .back-link {
      font-family: 'Inter', sans-serif;
      font-size: 14px; font-weight: 400;
      color: rgba(28, 24, 20, 0.36);
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- ── DARK ── -->
  <div class="phone-wrap">
    <div class="phone dark">
      <div class="island"></div>

      <div class="photo-zone">
        <img class="photo-img" src="artist.jpeg" alt="Artist" />
  
        <div class="photo-gradient-bottom"></div>
      </div>

      <div class="status-pill">
        <div class="status-dot"></div>
        <div class="status-text">Chapter I · Complete</div>
      </div>

      <div class="panel">
        <div class="eyebrow">Chapter II · Unlocks Wednesday</div>
        <div class="chapter-title">Music</div>
        <div class="chapter-subtitle">The sound that defines him.</div>
        <div class="flex-spacer"></div>
        <div class="progress-row">
          <div class="dot dot-done"></div>
          <div class="dot dot-next"></div>
          <div class="dot dot-next"></div>
          <div class="progress-label">1 of 3 chapters done</div>
        </div>
        <div class="follow-btn">+ Follow Reuben</div>
        <div class="back-link">Back to journey</div>
      </div>

      <div class="home-bar"></div>
    </div>
    <div class="label">Dark</div>
  </div>

  <!-- ── LIGHT ── -->
  <div class="phone-wrap">
    <div class="phone light">
      <div class="island"></div>

      <div class="photo-zone">
        <img class="photo-img" src="artist.jpeg" alt="Artist" />
  
        <div class="photo-gradient-bottom"></div>
      </div>

      <div class="status-pill">
        <div class="status-dot"></div>
        <div class="status-text">Chapter I · Complete</div>
      </div>

      <div class="panel">
        <div class="eyebrow">Chapter II · Unlocks Wednesday</div>
        <div class="chapter-title">Music</div>
        <div class="chapter-subtitle">The sound that defines him.</div>
        <div class="flex-spacer"></div>
        <div class="progress-row">
          <div class="dot dot-done"></div>
          <div class="dot dot-next"></div>
          <div class="dot dot-next"></div>
          <div class="progress-label">1 of 3 chapters done</div>
        </div>
        <div class="follow-btn">+ Follow Reuben</div>
        <div class="back-link">Back to journey</div>
      </div>

      <div class="home-bar"></div>
    </div>
    <div class="label">Light</div>
  </div>

</body>
</html>
